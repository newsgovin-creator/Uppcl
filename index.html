<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meter — Scanner Focus Mode</title>
  <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
  <style>
    :root {
      --wrap-width: 100%;
      --zoom: 1;
      --rotation: 0deg;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --font-weight: 700;
      --opacity: 0.85;
      --glass-opacity: 0.3;
      --dirt-opacity: 0.2;
      --moire-opacity: 0.1;
      --scanner-darkness: 0.7;
      --scanner-glow: 0.1;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #000;
      margin: 0;
      font-family: 'DS-Digital', monospace;
      padding: 10px;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    #svgFilters { 
      height: 0; 
      width: 0; 
      position: absolute; 
      visibility: hidden; 
    }

    .col { 
      width: 100%; 
      max-width: 600px; 
    }
    
    .meter-wrap {
      position: relative;
      width: 100%;
      max-width: 600px;
      aspect-ratio: 1 / 1.2;
      border: 2px solid #333;
      border-radius: 10px;
      box-shadow: 0 0 25px #111;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000;
      perspective: 800px;
    }
    
    .meter-img {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      object-fit: cover;
      transform: scale(var(--zoom));
      transform-origin: center;
      z-index: 1;
      transition: filter 0.3s ease;
    }
    
    /* Layers */
    .dirt-overlay, .glass-overlay, .moire-overlay {
      position: absolute;
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      pointer-events: none;
    }
    
    .dirt-overlay {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
      opacity: var(--dirt-opacity);
      mix-blend-mode: soft-light;
      z-index: 5;
    }

    .glass-overlay {
      background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 40%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0.05) 60%, rgba(255,255,255,0) 100%);
      opacity: var(--glass-opacity);
      mix-blend-mode: soft-light;
      z-index: 6;
    }

    .moire-overlay {
      background: repeating-radial-gradient(circle at 50% 50%, transparent 0px, transparent 2px, rgba(0, 0, 0, 0.2) 3px, transparent 4px);
      background-size: 100% 100%;
      opacity: var(--moire-opacity);
      mix-blend-mode: multiply;
      z-index: 7;
    }

    /* CONTAINERS */
    .reading-container {
      position: absolute;
      z-index: 100; 
      cursor: grab;
      user-select: none;
      transform-style: preserve-3d;
      transform: rotate(var(--rotation)) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateZ(1px);
    }
    
    .scanner-container {
      position: absolute;
      z-index: 90; 
      cursor: grab;
      user-select: none;
      transform-style: preserve-3d;
      transform: rotate(var(--rotation)) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateZ(1px);
      box-shadow: 0 0 0 0 rgba(0,0,0,0);
      transition: box-shadow 0.2s ease, background 0.2s ease;
      border-radius: 4px;
    }
    
    .scanner-mode-active {
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, var(--scanner-darkness));
      background: rgba(255, 255, 255, var(--scanner-glow));
      outline: 2px dashed rgba(255, 255, 255, 0.3);
    }

    @keyframes ac-flicker {
      0% { opacity: var(--opacity); }
      25% { opacity: calc(var(--opacity) * 0.96); }
      50% { opacity: calc(var(--opacity) * 0.99); }
      75% { opacity: calc(var(--opacity) * 0.94); }
      100% { opacity: var(--opacity); }
    }
    
    .flicker-active {
      animation: ac-flicker 0.06s infinite alternate; 
    }
    
    /* FLOATING MIC */
    .floating-mic {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #333;
      border: 2px solid #555;
      color: white;
      font-size: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
      user-select: none;
    }

    @keyframes pulse-green {
      0% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7); transform: scale(1); }
      50% { transform: scale(1.1); }
      70% { box-shadow: 0 0 0 15px rgba(0, 255, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); transform: scale(1); }
    }
    
    .mic-active {
      background-color: #00cc00 !important;
      border-color: #00ff00 !important;
      animation: pulse-green 1.5s infinite;
    }

    .reading {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      padding: 6px 10px;
      color: #000000;
      font-family: 'DS-Digital', monospace;
      font-weight: var(--font-weight);
      line-height: 1;
      white-space: nowrap;
      opacity: var(--opacity);
      transition: padding 0.3s ease;
    }
    .reading .value {
      font-size: clamp(24px, 6vw, 36px);
      position: relative;
      z-index: 2;
    }
    .reading .ghost {
      position: absolute;
      top: 6px;
      right: 10px;
      color: #000;
      opacity: 0.08;
      z-index: 1;
      filter: blur(0.5px);
      user-select: none;
      pointer-events: none;
    }
    
    /* INDEPENDENT UNITS & ICONS */
    .unit, .free-bulb, .md-icon, .oneb-icon {
      position: absolute;
      z-index: 100;
      cursor: grab;
      user-select: none;
      color: #000000;
      font-weight: var(--font-weight);
      line-height: 1;
      transform: rotate(var(--rotation)) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateZ(1px);
      opacity: var(--opacity);
    }

    .unit {
      font-family: monospace;
      padding: 4px 8px;
      font-size: clamp(12px, 4vw, 16px);
    }

    .md-icon {
      font-family: Arial, sans-serif;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .oneb-icon {
      font-family: monospace;
      border: 1px solid currentColor;
      padding: 1px 3px;
    }

    .free-bulb {
      width: 25px;
      height: 25px;
      display: none;
    }
    
    .resizer {
      position: absolute;
      width: 30px;
      height: 30px;
      right: -10px;
      bottom: -10px;
      background: transparent;
      cursor: se-resize;
      z-index: 101;
    }
    
    .merged { mix-blend-mode: multiply; }
    .noise-active { filter: url(#noiseFilter); }
    .camouflaged { filter: blur(0.6px); }
    .merged.noise-active.camouflaged { filter: url(#noiseFilter) blur(0.6px); }

    .image-gallery { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 10px; 
      margin-top: 10px; 
      justify-content: center; 
    }
    .gallery-thumb { 
      width: 60px; 
      height: 60px; 
      object-fit: cover; 
      border-radius: 5px; 
      cursor: pointer; 
      border: 2px solid transparent; 
    }
    .gallery-thumb:hover, .gallery-thumb.selected { 
      border-color: #0f0; 
    }
    
    .panel { 
      background: #071322; 
      padding: 12px; 
      border-radius: 10px; 
      width: 100%; 
      max-width: 600px; 
      box-shadow: 0 8px 28px rgba(0,0,0,0.6); 
      margin-top: 20px; 
    }
    .panel h3 { 
      margin: 0 0 8px 0; 
      font-size: 18px; 
      color: #dfffe3; 
    }
    .row { 
      margin: 8px 0; 
      display: flex; 
      gap: 8px; 
      align-items: center; 
      flex-wrap: wrap; 
    }
    label { 
      font-size: 13px; 
      color: #bcd8c6; 
      flex: 1; 
    }
    input, button { 
      font-size: 14px; 
      padding: 8px; 
      border-radius: 4px; 
      border: 1px solid #333; 
      background: #051018; 
      color: #fff; 
    }
    button { 
      background: #39c28a; 
      color: #04211a; 
      cursor: pointer; 
      border: none; 
    }
    button.ghost { 
      background: transparent; 
      color: #9ebaa7; 
      border: 1px solid rgba(255,255,255,0.1); 
    }
    
    button.scanner-btn { 
      background: #4285f4; 
      color: white; 
      border: none; 
    }
    button.scanner-btn.active { 
      background: #ea4335; 
      box-shadow: 0 0 10px #ea4335; 
    }

    button.danger { 
      background: #ff4444; 
      color: white; 
      border: none; 
      font-weight: bold; 
      width: 100%; 
      margin-bottom: 10px; 
    }
    button.danger:hover { 
      background: #cc0000; 
    }
    
    button.mic-action-btn { 
      background: #333; 
      color: white; 
      border: 1px solid #555; 
      width: 100%; 
      margin-bottom: 5px; 
      font-weight: bold; 
    }

    .slider { 
      width: 100%; 
      height: 6px; 
      -webkit-appearance: none; 
      background: #333; 
      border-radius: 3px; 
    }
    .slider::-webkit-slider-thumb { 
      width: 16px; 
      height: 16px; 
      border-radius: 50%; 
      background: #fff; 
      -webkit-appearance: none; 
      cursor: pointer; 
    }
    .slider-value { 
      color: #fff; 
      min-width: 50px; 
      text-align: right; 
      font-size: 12px; 
    }
    
    .section-title { 
      width: 100%; 
      color: #0f0; 
      font-size: 12px; 
      margin-top: 10px; 
      border-bottom: 1px solid #333; 
      padding-bottom: 2px; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
    }

    /* --- LOGIN OVERLAY CSS --- */
    #login-overlay {
      position: fixed;
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 999999;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
    }
    .login-box {
      background: #071322;
      padding: 40px 30px;
      border-radius: 12px;
      border: 2px solid #333;
      box-shadow: 0 10px 30px rgba(0,255,0,0.1);
      text-align: center;
      width: 100%;
      max-width: 350px;
    }
    .login-box h2 {
      color: #39c28a;
      margin-top: 0;
      margin-bottom: 25px;
      font-family: Arial, sans-serif;
    }
    .login-box input {
      width: 90%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #051018;
      color: #fff;
      font-size: 16px;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: #39c28a;
      color: #04211a;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    .login-box button:hover {
      background: #2ea875;
    }
    #loginError {
      color: #ff4444;
      margin-top: 15px;
      font-size: 14px;
      display: none;
      font-family: Arial, sans-serif;
    }

    #userNameInput {
      width: 90%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #051018;
      color: #fff;
      font-size: 16px;
    }
    #waiting-status {
      display: none; 
      color: #ffeb3b; 
      margin-top: 15px; 
      font-family: Arial; 
      font-size: 15px; 
      line-height: 1.6;
    }
  </style>
</head>

      <feComposite operator="in" in2="SourceGraphic" result="monoNoise"/>

        loginError.innerText = "❌ यह नाम सिस्टम में मौजूद नहीं है!";

            showWaitingScreen(devId);

          set(deviceRef, { name: selectedName, status: 'pending', approvalCount: 0 });

          showWaitingScreen(devId);
        }

        onValue(deviceRef, (snapshot) => {

        loginError.innerText = "❌ गलत ID या Password!";

      function autoAdjustSystem() {
          if (state.cuMode) {
              state.unitFont = Math.max(12, state.font * 0.35); 
              state.unitX = state.scanX + state.scanW - 18; 
              state.unitY = state.scanY + (state.scanH * 0.1);
          } else if (state.lntMode) {
              // --- SCANNER BOUNDARY MATH FOR L&T ---
              if (state.text.includes('.')) {
                  // L&T DECIMAL (0.03 kW)
                  state.unitFont = Math.max(12, state.font * 0.35); 
                  
                  // kW aligns middle-right inside scanner box
                  state.unitX = state.scanX + state.scanW - 12; 
                  state.unitY = state.scanY + (state.scanH * 0.40); 
                  
                  // MD aligns Top-Right inside scanner box
                  state.mdX = state.scanX + state.scanW - 6;
                  state.mdY = state.scanY + 2; 
                  
                  // 1 B aligns Bottom-Right inside scanner box
                  state.onebX = state.scanX + state.scanW - 8;
                  state.onebY = state.scanY + state.scanH - 18; 
              } else {
                  // L&T NORMAL (340 kWh)
                  state.unitFont = Math.max(12, state.font * 0.38); 
                  state.unitX = state.scanX + state.scanW - 18; 
                  state.unitY = state.scanY + (state.scanH * 0.22);
              }
              
              // Bulb Auto Adjust to Top-Left inside scanner box
              state.bulbX = state.scanX + (state.scanW * 0.08); 
              state.bulbY = state.scanY + (state.scanH * 0.20); 
          }
      }

                  recognition.stop();
                  floatMic.classList.remove('mic-active');
                  panelMicBtn.classList.remove('mic-active');
                  panelMicBtn.textContent = "🎤 Voice Control (ON/OFF)";
              }
          };

          floatMic.addEventListener('click', toggleMic);
          panelMicBtn.addEventListener('click', toggleMic);

          recognition.onresult = (event) => {
              const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
              
              if (transcript.includes('capital') || transcript.includes('कैपिटल') || transcript.includes('c u') || transcript.includes('सी यू') || transcript.includes('xyz')) {
                  if(!state.cuMode && !state.lntMode) {
                      memoryState = { unitFont: state.unitFont, unitX: state.unitX, unitY: state.unitY };
                  }
                  state.cuMode = true;
                  state.lntMode = false;
                  autoAdjustSystem(); 
              } 
              else if (transcript.includes('l&t') || transcript.includes('l n t') || transcript.includes('ln t') || transcript.includes('lnt') || transcript.includes('एलएनटी')) {
                  if(!state.lntMode && !state.cuMode) {
                      memoryState = { unitFont: state.unitFont, unitX: state.unitX, unitY: state.unitY };
                  }
                  state.lntMode = true;
                  state.cuMode = false;
                  autoAdjustSystem(); 
              }
              else if (transcript.includes('normal') || transcript.includes('नॉर्मल') || transcript.includes('हटाओ')) {
                  if(state.cuMode || state.lntMode) {
                      state.unitFont = memoryState.unitFont;
                      state.unitX = memoryState.unitX;
                      state.unitY = memoryState.unitY;
                  }
                  state.cuMode = false;
                  state.lntMode = false;
              }

              const decimalMatch = transcript.match(/(\d+(\.\d+)?)/);
              if (decimalMatch) {
                  const rawNumber = decimalMatch[0]; 
                  if (rawNumber.includes('.')) { 
                      state.text = `${rawNumber} kW`; 
                  } 
                  else {
                      let paddedNumber = rawNumber.padStart(6, '0');
                      if (transcript.includes('kw') || transcript.includes('watt')) { state.text = `${rawNumber} kW`; } 
                      else { state.text = `${paddedNumber} kWh`; }
                  }
              }
              applyState();
          };

          recognition.onend = () => { if(isListening) { try { recognition.start(); } catch(e) {} } };
          recognition.onerror = (e) => { if(isListening && e.error !== 'not-allowed') { try { recognition.stop(); recognition.start(); } catch(err){} } };

          masterResetBtn.addEventListener('click', () => {
              if(confirm('Are you sure you want to reset all settings?')) {
                  isListening = false; recognition.stop();
                  floatMic.classList.remove('mic-active');
                  panelMicBtn.classList.remove('mic-active');
                  panelMicBtn.textContent = "🎤 Voice Control (ON/OFF)";
                  localStorage.removeItem('finalVoiceMeterState');
                  Object.assign(state, defaults);
                  applyState();
              }
          });
      } else {
          floatMic.style.display = 'none';
          panelMicBtn.style.display = 'none';
          masterResetBtn.addEventListener('click', () => {
              if(confirm('Reset settings?')) { localStorage.removeItem('finalVoiceMeterState'); Object.assign(state, defaults); applyState(); }
          });
      }
      
      // DRAG & RESIZE SYSTEM
      let isDrag = false, startX, startY, startLeft, startTop;
      
      function startDrag(e, el, targetType) {
        if(e.target === resizer || e.target === scannerResizer) return; 
        e.preventDefault(); 
        isDrag = true;
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        const rect = wrap.getBoundingClientRect();
        
        startX = cx; 
        startY = cy; 
        
        if (targetType === 'group') {
            startLeft = state.x; startTop = state.y;
        } else if (targetType === 'unit') {
            startLeft = state.unitX; startTop = state.unitY;
        } else if (targetType === 'bulb') {
            startLeft = state.bulbX; startTop = state.bulbY;
        } else if (targetType === 'scanner') {
            startLeft = state.scanX; startTop = state.scanY;
        } else if (targetType === 'md') {
            startLeft = state.mdX; startTop = state.mdY;
        } else if (targetType === 'oneb') {
            startLeft = state.onebX; startTop = state.onebY;
        }

        const moveHandler = (ev) => {
            if(!isDrag) return;
            const mcx = ev.touches ? ev.touches[0].clientX : ev.clientX;
            const mcy = ev.touches ? ev.touches[0].clientY : ev.clientY;
            let nx = startLeft + ((mcx - startX) / rect.width * 100);
            let ny = startTop + ((mcy - startY) / rect.height * 100);
            
            el.style.left = nx + '%';
            el.style.top = ny + '%';
            
            if(targetType === 'group') { 
                state.x = nx; state.y = ny; 
            } else if (targetType === 'unit') { 
                state.unitX = nx; state.unitY = ny; 
            } else if (targetType === 'bulb') {
                state.bulbX = nx; state.bulbY = ny;
            } else if (targetType === 'scanner') {
                state.scanX = nx; state.scanY = ny;
            } else if (targetType === 'md') {
                state.mdX = nx; state.mdY = ny;
            } else if (targetType === 'oneb') {
                state.onebX = nx; state.onebY = ny;
            }
        };

        const stopHandler = () => { 
            isDrag = false; 
            window.removeEventListener('mousemove', moveHandler); 
            window.removeEventListener('mouseup', stopHandler); 
            window.removeEventListener('touchmove', moveHandler); 
            window.removeEventListener('touchend', stopHandler); 
            applyState(); 
        };

        window.addEventListener('mousemove', moveHandler); 
        window.addEventListener('mouseup', stopHandler); 
        window.addEventListener('touchmove', moveHandler); 
        window.addEventListener('touchend', stopHandler);
      }
      
      // Attach Drag Events
      readingGroup.addEventListener('mousedown', (e) => startDrag(e, readingGroup, 'group'));
      readingGroup.addEventListener('touchstart', (e) => startDrag(e, readingGroup, 'group'));
      
      scannerBox.addEventListener('mousedown', (e) => startDrag(e, scannerBox, 'scanner'));
      scannerBox.addEventListener('touchstart', (e) => startDrag(e, scannerBox, 'scanner'));
      
      unitElem.addEventListener('mousedown', (e) => startDrag(e, unitElem, 'unit'));
      unitElem.addEventListener('touchstart', (e) => startDrag(e, unitElem, 'unit'));

      lntBulb.addEventListener('mousedown', (e) => startDrag(e, lntBulb, 'bulb'));
      lntBulb.addEventListener('touchstart', (e) => startDrag(e, lntBulb, 'bulb'));

      mdDisplay.addEventListener('mousedown', (e) => startDrag(e, mdDisplay, 'md'));
      mdDisplay.addEventListener('touchstart', (e) => startDrag(e, mdDisplay, 'md'));

      onebDisplay.addEventListener('mousedown', (e) => startDrag(e, onebDisplay, 'oneb'));
      onebDisplay.addEventListener('touchstart', (e) => startDrag(e, onebDisplay, 'oneb'));
      
      // Attach Resize Events
      resizer.addEventListener('mousedown', (e) => initResize(e, 'group')); 
      resizer.addEventListener('touchstart', (e) => initResize(e, 'group'));
      
      scannerResizer.addEventListener('mousedown', (e) => initResize(e, 'scanner')); 
      scannerResizer.addEventListener('touchstart', (e) => initResize(e, 'scanner'));
      
      function initResize(e, targetType) {
          e.stopPropagation(); 
          e.preventDefault();
          const sW = targetType === 'scanner' ? state.scanW : state.w;
          const sH = targetType === 'scanner' ? state.scanH : state.h;
          const sx = e.touches ? e.touches[0].clientX : e.clientX;
          const sy = e.touches ? e.touches[0].clientY : e.clientY;
          const rect = wrap.getBoundingClientRect();
          
          let isResizing = true;

          const doResize = (ev) => {
              if(!isResizing) return;
              const mcx = ev.touches ? ev.touches[0].clientX : ev.clientX;
              const mcy = ev.touches ? ev.touches[0].clientY : ev.clientY;
              
              let newW = Math.max(5, sW + ((mcx - sx) / rect.width * 100));
              let newH = Math.max(2, sH + ((mcy - sy) / rect.height * 100));
              
              if(targetType === 'scanner') {
                  scannerBox.style.width = newW + '%';
                  scannerBox.style.height = newH + '%';
                  state.scanW = newW;
                  state.scanH = newH;
              } else {
                  readingGroup.style.width = newW + '%';
                  readingGroup.style.height = newH + '%';
                  state.w = newW;
                  state.h = newH;
                  state.font = Math.round((newH / 100) * rect.height * 0.6); 
                  display.style.fontSize = state.font + 'px';
                  ghostDisplay.style.fontSize = state.font + 'px';
              }
          };

          const stopResize = () => { 
              isResizing = false;
              window.removeEventListener('mousemove', doResize); 
              window.removeEventListener('mouseup', stopResize); 
              window.removeEventListener('touchmove', doResize); 
              window.removeEventListener('touchend', stopResize); 
              if(state.cuMode || state.lntMode) autoAdjustSystem(); 
              applyState();
          };

          window.addEventListener('mousemove', doResize); 
          window.addEventListener('mouseup', stopResize); 
          window.addEventListener('touchmove', doResize); 
          window.addEventListener('touchend', stopResize);
      }

      textInput.addEventListener('input', () => { state.text = textInput.value; applyState(); });
      fontRange.addEventListener('input', () => { state.font = +fontRange.value; applyState(); });
      unitFontRange.addEventListener('input', () => { state.unitFont = +unitFontRange.value; applyState(); });
      unitXRange.addEventListener('input', () => { state.unitX = +unitXRange.value; applyState(); });
      unitYRange.addEventListener('input', () => { state.unitY = +unitYRange.value; applyState(); });
      fontWeightRange.addEventListener('input', () => { state.fontWeight = +fontWeightRange.value; applyState(); });
      opacityRange.addEventListener('input', () => { state.opacity = +opacityRange.value; applyState(); });
      rotationInput.addEventListener('input', () => { state.rotation = +rotationInput.value; applyState(); });
      tiltXRange.addEventListener('input', () => { state.tiltX = +tiltXRange.value; applyState(); });
      tiltYRange.addEventListener('input', () => { state.tiltY = +tiltYRange.value; applyState(); });
      edgeBlurRange.addEventListener('input', () => { state.edgeBlur = +edgeBlurRange.value; applyState(); });
      zoomRange.addEventListener('input', () => { state.zoom = +zoomRange.value; applyState(); });
      colorInput.addEventListener('input', () => { state.color = colorInput.value; applyState(); });
      glassRange.addEventListener('input', () => { state.glassOpacity = +glassRange.value; applyState(); });
      dirtRange.addEventListener('input', () => { state.dirtOpacity = +dirtRange.value; applyState(); });
      moireRange.addEventListener('input', () => { state.moireOpacity = +moireRange.value; applyState(); });
      noiseBtn.addEventListener('click', () => { state.noise = !state.noise; applyState(); });
      ghostBtn.addEventListener('click', () => { state.ghost = !state.ghost; applyState(); });
      flickerBtn.addEventListener('click', () => { state.flicker = !state.flicker; applyState(); });
      
      scannerBtn.addEventListener('click', () => { 
          state.scannerMode = !state.scannerMode; 
          applyState(); 
      });
      
      scannerDarkRange.addEventListener('input', () => { state.scannerDarkness = +scannerDarkRange.value; applyState(); });

      const gallery = document.getElementById('imageGallery');
      function loadGallery() {
          gallery.innerHTML = '';
          meterImages.forEach((src, idx) => {
              const img = document.createElement('img'); img.src = src; img.className = 'gallery-thumb'; if(idx === 0) img.classList.add('selected');
              img.onclick = () => { document.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('selected')); img.classList.add('selected'); meterImg.src = src; };
              gallery.appendChild(img);
          });
      }
      loadGallery();
      addImageBtn.addEventListener('click', () => { const url = document.getElementById('imageInput').value; if(url) { meterImages.push(url); loadGallery(); } });

      exportBtn.addEventListener('click', () => {
        const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d'), img = new Image();
        img.crossOrigin = 'anonymous'; img.src = meterImg.src;
        img.onload = () => {
            const z = state.zoom; canvas.width = img.width * z; canvas.height = img.height * z; ctx.scale(z, z); ctx.drawImage(img, 0, 0);
            
            // Scanner Box Export
            if(state.scannerMode) {
                ctx.save(); ctx.fillStyle = `rgba(0,0,0,${state.scannerDarkness})`; ctx.fillRect(0,0,img.width, img.height);
                const rx = (state.scanX / 100) * img.width, ry = (state.scanY / 100) * img.height, rw = (state.scanW / 100) * img.width, rh = (state.scanH / 100) * img.height;
                ctx.translate(rx, ry); ctx.rotate(state.rotation * Math.PI / 180);
                ctx.globalCompositeOperation = 'destination-out'; ctx.fillRect(0, 0, rw, rh);
                ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 2; ctx.strokeRect(0, 0, rw, rh);
                ctx.restore();
            }

            // Bulb Export
            if (state.lntMode) {
                ctx.save();
                const bx = (state.bulbX / 100) * img.width;
                const by = (state.bulbY / 100) * img.height;
                ctx.translate(bx, by); 
                const rad = state.rotation * Math.PI / 180;
                ctx.transform(Math.cos(rad), Math.sin(rad) + (state.tiltY/200), -Math.sin(rad) + (state.tiltX/200), Math.cos(rad), 0, 0);
                
                const bulbPath = new Path2D("M9 21h6v-1H9v1zm3-19C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7z");
                ctx.fillStyle = state.color;
                ctx.globalCompositeOperation = 'multiply';
                ctx.globalAlpha = state.opacity;
                if(state.edgeBlur > 0 && ctx.filter) ctx.filter = `blur(${state.edgeBlur}px)`;
                
                const rh = (state.scanH / 100) * img.height; 
                const scaleAmt = (rh * 0.35) / 24; 
                ctx.scale(scaleAmt, scaleAmt);
                ctx.translate(-12, -12); 
                ctx.fill(bulbPath);
                ctx.restore();
            }
            
            // Text Export Helper
            const drawText = (text, xPct, yPct, size, isGhost) => {
                ctx.save(); const tx = (xPct / 100) * img.width, ty = (yPct / 100) * img.height; ctx.translate(tx, ty);
                const rad = state.rotation * Math.PI / 180; ctx.transform(Math.cos(rad), Math.sin(rad) + (state.tiltY/200), -Math.sin(rad) + (state.tiltX/200), Math.cos(rad), 0, 0);
                ctx.font = `${state.fontWeight} ${size}px 'DS-Digital', monospace`; ctx.textBaseline = 'middle'; ctx.textAlign = 'right'; 
                ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = isGhost ? 0.08 : state.opacity; ctx.fillStyle = state.color;
                if (state.edgeBlur > 0 && ctx.filter) ctx.filter = `blur(${state.edgeBlur}px)`;
                
                let tw = 0; for(let c of text) tw += ctx.measureText(c).width; let xc = -tw;
                let rightPaddingOffset = (state.lntMode || state.cuMode) ? (state.w/100*img.width) * 0.25 : 10;
                
                for (let char of text) { 
                    ctx.fillText(char, xc + (state.w/100*img.width) - rightPaddingOffset, (state.h/100*img.height)/2); 
                    xc += ctx.measureText(char).width; 
                }
                ctx.restore();
            };
            
            const parts = state.text.split(' '), val = parts[0], unit = parts.slice(1).join(' ');
            if(state.ghost) { drawText(val.replace(/[0-9.]/g, '8'), state.x, state.y, state.font, true); }
            drawText(val, state.x, state.y, state.font, false);
            
            // L&T DECIMAL MD Export
            if(state.lntMode && val.includes('.')) {
                ctx.save();
                const mdx = (state.mdX / 100) * img.width, mdy = (state.mdY / 100) * img.height; 
                ctx.translate(mdx, mdy);
                ctx.rotate(state.rotation * Math.PI / 180); 
                ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = state.opacity; ctx.fillStyle = state.color;
                if(state.edgeBlur > 0) ctx.filter = `blur(${state.edgeBlur}px)`; 
                ctx.font = `bold ${state.unitFont * 0.7}px Arial, sans-serif`;
                ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                ctx.fillText("MD", 0, 0);
                ctx.restore();

                // L&T DECIMAL 1 B Export
                ctx.save();
                const obx = (state.onebX / 100) * img.width, oby = (state.onebY / 100) * img.height; 
                ctx.translate(obx, oby);
                ctx.rotate(state.rotation * Math.PI / 180); 
                ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = state.opacity; ctx.fillStyle = state.color;
                if(state.edgeBlur > 0) ctx.filter = `blur(${state.edgeBlur}px)`; 
                ctx.font = `${state.fontWeight} ${state.unitFont * 0.6}px monospace`;
                ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                let boxW = ctx.measureText("1 B").width;
                ctx.strokeRect(-2, 0, boxW + 4, state.unitFont * 0.8);
                ctx.fillText("1 B", 0, state.unitFont * 0.1);
                ctx.restore();
            }

            // Unit Export (kW or kWh)
            ctx.save();
            const ux = (state.unitX / 100) * img.width, uy = (state.unitY / 100) * img.height; 
            ctx.translate(ux, uy);
            ctx.rotate(state.rotation * Math.PI / 180); 
            ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = state.opacity; ctx.fillStyle = state.color;
            if(state.edgeBlur > 0) ctx.filter = `blur(${state.edgeBlur}px)`; 
            
            if (state.cuMode) {
                if (val.includes('.')) {
                    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                    ctx.font = `${state.fontWeight} ${state.unitFont * 1.4}px 'DS-Digital', monospace`;
                    let mdW = ctx.measureText("MD").width;
                    ctx.font = `${state.fontWeight} ${state.unitFont * 1.1}px monospace`;
                    let kwW = ctx.measureText("kW").width;
                    let maxW = Math.max(mdW, kwW);
                    ctx.font = `${state.fontWeight} ${state.unitFont * 1.4}px 'DS-Digital', monospace`;
                    ctx.fillText("MD", maxW - mdW, 0);
                    ctx.font = `${state.fontWeight} ${state.unitFont * 1.1}px monospace`;
                    ctx.fillText("kW", maxW - kwW, state.unitFont * 1.2);
                } else {
                    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                    ctx.font = `${state.fontWeight} ${state.unitFont * 1.7}px 'DS-Digital', monospace`;
                    let cW = ctx.measureText("C").width;
                    ctx.font = `${state.fontWeight} ${state.unitFont * 1.3}px 'DS-Digital', monospace`;
                    let uW = ctx.measureText("u").width;
                    let topW = cW + 2 + uW;
                    ctx.font = `${state.fontWeight} ${state.unitFont * 1.0}px monospace`;
                    let btmW = ctx.measureText("kW h").width;
                    let maxW = Math.max(topW, btmW);
                    let topX = maxW - topW;
                    ctx.font = `${state.fontWeight} ${state.unitFont * 1.7}px 'DS-Digital', monospace`;
                    ctx.fillText("C", topX, 0);
                    ctx.save(); ctx.beginPath(); ctx.rect(topX + cW + 2, state.unitFont * 0.35, uW + 5, state.unitFont); ctx.clip();
                    ctx.font = `${state.fontWeight} ${state.unitFont * 1.3}px 'DS-Digital', monospace`;
                    ctx.fillText("u", topX + cW + 2, 0); ctx.restore();
                    ctx.font = `${state.fontWeight} ${state.unitFont * 1.0}px monospace`;
                    ctx.fillText("kW h", maxW - btmW, state.unitFont * 1.4);
                }
            } else if (state.lntMode) {
                ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                ctx.font = `${state.fontWeight} ${state.unitFont}px monospace`;
                if(val.includes('.')) {
                    ctx.fillText("kW", 0, 0);
                } else {
                    ctx.fillText("kW h", 0, 0);
                }
            } else {
                ctx.font = `${state.fontWeight} ${state.unitFont}px monospace`;
                ctx.fillText(unit, 0, 0); 
            }
            ctx.restore();
            
            const link = document.createElement('a'); link.download = 'meter.jpg'; link.href = canvas.toDataURL('image/jpeg', 0.9); link.click();
        };
        img.onerror = () => alert('CORS Error: Image cannot be saved.');
      });
      applyState();
    })();
  </script>
</body>
</html>
