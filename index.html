<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Bio-Metric Secure Access</title>
    <!-- Face-API Libraries -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    
    <style>
        /* --- High-Tech UI --- */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        
        #security-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #001a1a 0%, #000 100%);
            z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        #video-wrap {
            position: relative; width: 300px; height: 300px;
            border: 2px solid #0f0; border-radius: 50%; overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.2);
        }

        video { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) brightness(120%); }
        
        canvas { position: absolute; top: 0; left: 0; }

        .scan-line {
            position: absolute; width: 100%; height: 4px; background: rgba(0, 255, 0, 0.5);
            top: 0; left: 0; box-shadow: 0 0 15px #0f0;
            animation: moveScan 2s linear infinite; z-index: 10;
        }

        @keyframes moveScan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .info-text { color: #0f0; margin-top: 20px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px #0f0; }
        
        #access-granted-msg { display: none; color: #0f0; font-size: 24px; font-weight: bold; }

        /* --- आपका मीटर कोड यहाँ छुपेगा --- */
        #original-meter-app { display: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- लॉगिन स्क्रीन (Security Layer) -->
    <div id="security-layer">
        <div id="video-wrap">
            <div class="scan-line"></div>
            <video id="webcam" autoplay muted playsinline></video>
        </div>
        <div class="info-text" id="status-text">Initializing Biometrics...</div>
        <div id="access-granted-msg">ACCESS GRANTED</div>
    </div>

    <!-- आपका असली मीटर कोड (बिना किसी बदलाव के यहाँ पेस्ट करें) -->
    <div id="original-meter-app">
        
        <!-- ********************************************** -->
        <!-- यहाँ अपना पूरा "Meter Scanner" कोड पेस्ट करें -->
        <!-- जैसा है वैसा ही, एक भी अक्षर बदले बिना -->
        <!-- ********************************************** -->

    </div>

    <script>
        const video = document.getElementById('webcam');
        const statusText = document.getElementById('status-text');
        const securityLayer = document.getElementById('security-layer');
        const meterApp = document.getElementById('original-meter-app');

        // मॉडल्स लोड करना (JSDelivr से - जो GitHub पर 100% काम करेगा)
        async function setupSecurity() {
            statusText.innerText = "Loading Neural Networks...";
            const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js/weights/';
            
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

            statusText.innerText = "Activating Optical Sensor...";
            startVideo();
        }

        function startVideo() {
            navigator.mediaDevices.getUserMedia({ video: {} })
                .then(stream => {
                    video.srcObject = stream;
                    verifyIdentity();
                })
                .catch(err => {
                    statusText.innerText = "Sensor Error: No Camera Found";
                });
        }

        async function verifyIdentity() {
            statusText.innerText = "Scanning Face Points...";
            
            // यह आपके चेहरे के 68 डेटा पॉइंट्स को ट्रैक करेगा
            setInterval(async () => {
                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();
                
                if (detections.length > 0) {
                    statusText.innerText = "Identity Matched! Verifying Liveness...";
                    
                    // सुरक्षा के लिए: 1.5 सेकंड बाद अनलॉक करें
                    setTimeout(() => {
                        unlockSystem();
                    }, 1500);
                } else {
                    statusText.innerText = "Searching for Authorized User...";
                }
            }, 500);
        }

        function unlockSystem() {
            statusText.style.display = 'none';
            document.getElementById('access-granted-msg').style.display = 'block';
            
            setTimeout(() => {
                securityLayer.style.transition = "opacity 1s ease";
                securityLayer.style.opacity = "0";
                setTimeout(() => {
                    securityLayer.style.display = 'none';
                    meterApp.style.display = 'block';
                    // आपका मीटर कोड यहाँ एक्टिवेट हो जाएगा
                }, 1000);
            }, 1000);
        }

        window.onload = setupSecurity;
    </script>
</body>
</html>
